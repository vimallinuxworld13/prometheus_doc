global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    file_sd_configs:
      - files:
          - 'targets.json'

  - job_name: "docker-nodes"
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
